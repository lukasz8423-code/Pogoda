<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050A14}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:#E8EDF5;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#050A14;display:flex;flex-direction:column;position:relative;overflow:hidden}
input,button{font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes nowPulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}70%{box-shadow:0 0 0 8px rgba(99,102,241,0)}}
@keyframes rainDrop{0%{transform:translateY(-60px);opacity:0}15%{opacity:.6}85%{opacity:.6}100%{transform:translateY(110vh);opacity:0}}
@keyframes snowFall{0%{transform:translateY(-10px) translateX(0);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateY(110vh) translateX(35px);opacity:0}}
@keyframes cloudDrift{from{transform:translateX(-280px)}to{transform:translateX(110vw)}}
@keyframes starBlink{0%,100%{opacity:.06}50%{opacity:.9}}
@keyframes lightFlash{0%,87%,100%{opacity:0}89%,95%{opacity:1}91%,97%{opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes alertSlide{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes chartGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
:root{
  --bg:#050A14;--bg2:#0B1221;--bg3:#111827;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text1:#E8EDF5;--text2:#94A3B8;--text3:#475569;
  --blue:#6366F1;--blue2:#818CF8;--cyan:#38BDF8;
  --green:#34D399;--amber:#FBBF24;--red:#F87171;
}
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.rdrop{position:absolute;width:1px;background:linear-gradient(180deg,rgba(147,197,253,.5),transparent);animation:rainDrop linear infinite}
.sflake{position:absolute;background:rgba(255,255,255,.8);border-radius:50%;animation:snowFall ease-in-out infinite}
.cldp{position:absolute;background:radial-gradient(circle,rgba(148,163,184,.06),transparent);border-radius:50%;animation:cloudDrift linear infinite}
.starp{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:starBlink ease-in-out infinite}
.lflash{position:fixed;inset:0;background:rgba(255,255,255,.03);pointer-events:none;z-index:1;animation:lightFlash 10s ease-in-out infinite}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
.scroller{flex:1;overflow-y:auto;padding:0 16px 100px;position:relative;z-index:2}
.pill{padding:6px 13px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;font-size:11px;font-weight:700;color:var(--text2);display:inline-flex;align-items:center;gap:4px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;font-weight:800;font-size:15px;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 32px rgba(99,102,241,.35);transition:all .2s}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:10px 13px;cursor:pointer;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-ghost:active{background:rgba(255,255,255,.1)}
.btn-pill{padding:8px 16px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-pill:active{background:rgba(255,255,255,.1);color:var(--text1)}
.inp{width:100%;padding:14px 44px 14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;color:var(--text1);font-size:14px;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--text3)}
.dd{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;overflow:hidden;z-index:99;max-height:220px;overflow-y:auto;animation:fadeUp .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ddi{width:100%;text-align:left;padding:13px 16px;display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;background:transparent;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}

.rtime{position:absolute;bottom:10px;left:10px;padding:4px 10px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.08);border-radius:8px;font-size:10px;font-weight:700;font-family:monospace;color:#fff}
.rzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.rzoom button{width:30px;height:30px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.rleg{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;font-size:10px;font-weight:700}

<script>
'use strict';
const POPULAR=[
  {n:"Tomaszewo",lat:52.80254,lng:19.20505},
  {n:"Lipno",lat:52.84207,lng:19.18316},
  {n:"Toruń",lat:53.01375,lng:18.59814},
  {n:"Warszawa",lat:52.2297,lng:21.0122},
  {n:"Gdańsk",lat:54.352,lng:18.6466},
  {n:"Kraków",lat:50.0647,lng:19.945},
  {n:"Wrocław",lat:51.1079,lng:17.0385},
];

function wMeta(code,isDay){
  isDay=isDay!==false;
  if(code===0)return{e:isDay?"☀️":"🌙",t:"Bezchmurnie"};
  if(code<=2)return{e:"🌤️",t:"Częściowe zachmurzenie"};
  if(code===3)return{e:"☁️",t:"Zachmurzenie"};
  if(code<=48)return{e:"🌫️",t:"Mgła"};
  if(code<=55)return{e:"🌦️",t:"Mżawka"};
  if(code<=57)return{e:"🌧️",t:"Marznąca mżawka"};
  if(code<=65)return{e:"🌧️",t:"Deszcz"};
  if(code<=67)return{e:"🌨️",t:"Marznący deszcz"};
  if(code<=77)return{e:"❄️",t:"Śnieg"};
  if(code<=82)return{e:"🌦️",t:"Przelotny deszcz"};
  if(code<=86)return{e:"🌨️",t:"Przelotny śnieg"};
  if(code>=95)return{e:"⛈️",t:"Burza"};
  return{e:"🌥️",t:"Zachmurzenie"};
}
function wdir(d){return["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round((d%360)/22.5)%16];}
function uvLbl(v){return v<3?"Niskie":v<6?"Umiarkowane":v<8?"Wysokie":"B. wysokie";}
function pad(n){return String(n).padStart(2,"0");}


// Temperatura na słońcu i w cieniu
// Na podstawie promieniowania słonecznego, wiatru i wilgotności
function calcSunShadeTemp(tempC, radiation, windKmh, humidity){
  // Temperatura w cieniu = apparent_temperature (juz mamy)
  // Temperatura na słońcu = temp + efekt promieniowania
  // Wzór oparty na WBGT (Wet Bulb Globe Temperature) uproszczony
  
  const windMs = windKmh / 3.6;
  
  // Efekt promieniowania na człowieka (W/m²) -> °C
  // Przy 800 W/m² ciało pochłania ok 6-8°C więcej
  const radiationEffect = radiation > 0 
    ? Math.min(12, (radiation / 1000) * 10 * (1 - humidity/200))
    : 0;
  
  // Korekta wiatru - wiatr chłodzi
  const windCool = windMs > 0.5 ? Math.min(3, windMs * 0.5) : 0;
  
  const sunTemp = Math.round((tempC + radiationEffect - windCool) * 10) / 10;
  const shadeTemp = Math.round(tempC * 10) / 10;
  
  return { sun: sunTemp, shade: shadeTemp };
}
// POPRAWNA logika porady — temperatura priorytetem
function advice(city,cur){
  const t=Math.round(cur?.temperature_2m??15);
  const c=cur?.weather_code??0;
  const isStorm=c>=95;
  const isSnow=(c>=71&&c<=77)||(c>=85&&c<=86);
  const isRain=(c>=51&&c<=67)||(c>=80&&c<=82);
  const isMist=c>=45&&c<=48;

  if(isStorm)return{a:`Burza w ${city} (${t}°C)! Zostań w domu, odłącz urządzenia elektryczne.`,cl:"Zostań w domu",ac:"Obserwuj błyskawice przez okno"};
  // Śnieg TYLKO gdy zimno
  if(isSnow&&t<=3)return{a:`Śnieg w ${city} przy ${t}°C. Weź łopatę!`,cl:"Kożuch, czapa uszatka, ciepłe buty",ac:"Odśnieżanie lub bałwan"};
  if(isRain)return{a:`Deszcz w ${city} (${t}°C). Parasol obowiązkowy.`,cl:"Kalosze, kurtka przeciwdeszczowa",ac:"Kawa i kanapa"};
  if(isMist)return{a:`Mgła w ${city} (${t}°C). Jedź ostrożnie.`,cl:"Kurtka i sweter",ac:"Ostrożna jazda, włącz światła"};
  if(t>=32)return{a:`Upał w ${city} – aż ${t}°C! Unikaj słońca między 11-15.`,cl:"Przewiewne ubranie, kapelusz, okulary",ac:"Klimatyzacja lub basen"};
  if(t>=27)return{a:`Gorąco w ${city}, ${t}°C. Pij dużo wody.`,cl:"Lekkie ubranie, nakrycie głowy",ac:"Spacer rano lub wieczorem"};
  if(t>=22)return{a:`Piękna pogoda w ${city}, ${t}°C! Wychodzisz?`,cl:"T-shirt lub lekka koszula",ac:"Rower, spacer, taras"};
  if(t>=17)return{a:`Przyjemne ${t}°C w ${city}. Idealna pogoda.`,cl:"Bluza lub cienka kurtka",ac:"Spacer, rower, zakupy"};
  if(t>=12)return{a:`Chłodnawo w ${city} (${t}°C). Weź kurtkę.`,cl:"Kurtka i bluza",ac:"Szybki spacer lub zakupy"};
  if(t>=5)return{a:`Zimno w ${city} (${t}°C). Ubierz się ciepło.`,cl:"Kurtka, sweter, długie spodnie",ac:"Herbata i krótki spacer"};
  return{a:`Mróz w ${city} (${t}°C)! Bez grubej kurtki ani kroku.`,cl:"Najgrubsza kurtka, szal, czapka",ac:"Dom, kaloryfer, herbata z prądem"};
}

// POPRAWIONY indeks dyskomfortu
function discomfortIndex(temp,hum){
  let hi;
  if(temp<27){
    // Uproszczona formuła dla niskich temperatur
    hi=temp-(0.55-0.0055*hum)*(temp-14.5);
  } else {
    // Steadman dla wysokich temperatur
    hi=-8.784695+1.61139411*temp+2.3385248*hum
       -0.14611605*temp*hum-0.012308094*temp*temp
       -0.016424828*hum*hum+0.002211732*temp*temp*hum
       +0.00072546*temp*hum*hum-0.000003582*temp*temp*hum*hum;
  }
  hi=Math.round(hi);
  let label,color,emoji;
  if(temp<=0){label="Mrozowo";color="rgba(56,189,248,.12)";emoji="🥶";}
  else if(hi<10){label="Zimno";color="rgba(56,189,248,.12)";emoji="🧊";}
  else if(hi<17){label="Chłodno";color="rgba(99,102,241,.1)";emoji="😐";}
  else if(hi<22){label="Komfortowo";color="rgba(52,211,153,.1)";emoji="😊";}
  else if(hi<27){label="Przyjemnie";color="rgba(52,211,153,.08)";emoji="😌";}
  else if(hi<32){label="Ciepło";color="rgba(251,191,36,.1)";emoji="😅";}
  else if(hi<38){label="Gorąco";color="rgba(249,115,22,.12)";emoji="🥵";}
  else{label="Bardzo gorąco";color="rgba(248,113,113,.12)";emoji="🔥";}
  return{value:hi,label,color,emoji};
}

      "uv_index","wind_speed_10m","relative_humidity_2m",

    ].join(","),

      "precipitation_probability_max","precipitation_sum",

    ].join(","),
    timezone:"auto",

// Haversine distance w km
function stationDist(lat1,lng1,lat2,lng2){
  const R=6371,d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r,dLng=(lng2-lng1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Pobierz dane ze wszystkich stacji IMGW
async function fetchIMGWAll(){

    if(!r.ok)throw new Error("HTTP "+r.status);

  }catch(e){console.warn("IMGW API niedostepne:",e.message);return null;}

// Znajdz najblizsze stacje IMGW i zwroc liste posortowana wg odleglosci
async function findNearestIMGW(lat,lng){
  const all=await fetchIMGWAll();
  if(!all||!Array.isArray(all)||all.length===0)return null;

  const results=[];
  all.forEach(s=>{
    // Dopasuj dane API do wspolrzednych ze slownika
    const known=IMGW_STATIONS.find(k=>{
      const nameMatch=s.stacja&&(
        s.stacja.toLowerCase()===k.name.toLowerCase()||
        s.stacja.toLowerCase().includes(k.name.toLowerCase())||
        k.name.toLowerCase().includes(s.stacja.toLowerCase())
      );
      const idMatch=s.id_stacji&&(s.id_stacji===k.id||s.id_stacji.includes(k.id)||k.id.includes(s.id_stacji));
      return nameMatch||idMatch;
    });
    if(!known)return;
    const dist=stationDist(lat,lng,known.lat,known.lng);
    results.push({
      ...s,
      ...known,
      dist:Math.round(dist*10)/10
    });
  });

  // Sortuj od najblizszej
  results.sort((a,b)=>a.dist-b.dist);

  if(results.length===0)return null;

  const best=results[0];
  console.log(`Najblizsa stacja IMGW: ${best.stacja||best.name} (${best.dist} km)`);
  console.log(`Dane: temp=${best.temperatura}°C, wilg=${best.wilgotnosc_wzgledna}%, wiatr=${best.predkosc_wiatru}m/s, ciśnienie=${best.cisnienie}hPa`);

  // Zwroc najblizsa stacje + liste wszystkich w promieniu 100km
  return {
    best,
    nearby:results.filter(r=>r.dist<=100).slice(0,5)
  };
}

  sec.appendChild(wrap);

  leg.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap">${[["#34D399","Lekki"],["#FBBF24","Umiarkowany"],["#F87171","Intensywny/Burza"]].map(([c,l])=>`<div style="display:flex;align-items:center;gap:5px;color:#64748B"><div style="width:10px;height:10px;background:${c};border-radius:3px;opacity:.8"></div>${l}</div>`).join("")}</div><span style="color:#6366F1;font-weight:700">🧭 NE +12 km/h</span>`;
  sec.appendChild(leg);

  if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  const cells=storm?[{x:45,y:48,r:35,tp:"heavy"},{x:50,y:52,r:60,tp:"heavy"},{x:58,y:60,r:85,tp:"mod"}]:
    heavy?[{x:45,y:48,r:25,tp:"mod"},{x:52,y:54,r:60,tp:"light"}]:

  function draw(){
    const c=document.getElementById("rc");if(!c)return;
    const ctx=c.getContext("2d");const W=c.width,H=c.height;
    ctx.fillStyle="#020817";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
    const mR=Math.min(W,H)*.45;
    ctx.strokeStyle="rgba(99,102,241,.12)";ctx.lineWidth=1;
    for(let r=mR/4;r<=mR;r+=mR/4){ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(99,102,241,.4)";ctx.font="bold 8px monospace";ctx.textAlign="left";ctx.fillText(Math.round(r/mR*50)+"km",W/2+4,H/2-r+3);}
    ctx.strokeStyle="rgba(99,102,241,.07)";ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
    ctx.fillStyle="rgba(99,102,241,.5)";ctx.font="bold 9px sans-serif";ctx.textAlign="center";
    ctx.fillText("N",W/2,13);ctx.fillText("S",W/2,H-4);ctx.textAlign="right";ctx.fillText("W",14,H/2+4);ctx.textAlign="left";ctx.fillText("E",W-14,H/2+4);
    sweep=(sweep+0.022)%(Math.PI*2);
    const sg=ctx.createRadialGradient(W/2,H/2,5,W/2,H/2,mR);sg.addColorStop(0,"rgba(99,102,241,.2)");sg.addColorStop(1,"rgba(99,102,241,0)");
    ctx.save();ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.arc(W/2,H/2,mR,sweep-.42,sweep);ctx.closePath();ctx.fillStyle=sg;ctx.fill();ctx.restore();
    ctx.strokeStyle="rgba(129,140,248,.9)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(sweep)*mR,H/2+Math.sin(sweep)*mR);ctx.stroke();

      const cx=cell.x/100*W,cy=cell.y/100*H;
      const rg=ctx.createRadialGradient(cx,cy,2,cx,cy,cell.r);

      else if(cell.tp==="mod"){rg.addColorStop(0,"rgba(251,191,36,.9)");rg.addColorStop(.5,"rgba(52,211,153,.6)");rg.addColorStop(1,"rgba(52,211,153,0)");}
      else{rg.addColorStop(0,"rgba(52,211,153,.6)");rg.addColorStop(1,"rgba(52,211,153,0)");}
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,cell.r,0,Math.PI*2);ctx.fill();
      if(storm&&Math.random()<.04){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.shadowColor="#FBBF24";ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(cx+Math.random()*20-10,cy-20);ctx.lineTo(cx+Math.random()*10-5,cy);ctx.lineTo(cx+Math.random()*20-10,cy+20);ctx.stroke();ctx.shadowBlur=0;}
    });
    TOWNS.forEach(t=>{
      const tx=t.x/100*W,ty=t.y/100*H;
      ctx.font=t.c?"bold 9px sans-serif":"bold 8px sans-serif";ctx.textAlign="center";
      const tw2=ctx.measureText(t.name).width;
      ctx.fillStyle="rgba(11,18,33,.92)";ctx.strokeStyle=t.c?"rgba(99,102,241,.7)":"rgba(255,255,255,.12)";ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(tx-tw2/2-5,ty-14,tw2+10,18,4);ctx.fill();ctx.stroke();
      ctx.fillStyle=t.c?"#818CF8":"#94A3B8";ctx.beginPath();ctx.arc(tx,ty+2,t.c?3.5:2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=t.c?"#fff":"#CBD5E1";ctx.fillText(t.name,tx,ty-3);
    });
    ctx.restore();RAF=requestAnimationFrame(draw);
  }
  setTimeout(draw,120);return sec;
}

  for(let i=0;i<24;i++){const idx=ci+i;if(idx<hourly.time.length)temps.push({t:Math.round(hourly.temperature_2m[idx]),lb:i===0?"Teraz":new Date(hourly.time[idx]).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"}),pop:hourly.precipitation_probability?.[idx]??0});}
  if(temps.length===0){return wrap;}
  const min=Math.min(...temps.map(x=>x.t)),max=Math.max(...temps.map(x=>x.t)),range=Math.max(1,max-min);
  temps.forEach((item,i)=>{
    const bw=document.createElement("div");bw.className="chart-bar-wrap";
    const val=document.createElement("div");val.className="chart-val";val.textContent=item.t+"°";
    const bar=document.createElement("div");bar.className="chart-bar";
    const h=Math.round(((item.t-min)/range)*55+15);
    bar.style.cssText=`height:${h}px;background:${item.t>=25?"linear-gradient(180deg,#F87171,#FB923C)":item.t<=5?"linear-gradient(180deg,#38BDF8,#818CF8)":"linear-gradient(180deg,#818CF8,#34D399)"};animation-delay:${i*.04}s`;
    if(i===0)bar.style.outline="2px solid rgba(255,255,255,.3)";
    const time=document.createElement("div");time.className="chart-time";time.textContent=i===0?"Teraz":item.lb.replace(":00","");
    bw.appendChild(val);bw.appendChild(bar);bw.appendChild(time);inner.appendChild(bw);
  });
  scroll.appendChild(inner);wrap.appendChild(scroll);return wrap;
}

function el(tag,a,kids){
  const e=document.createElement(tag);
  Object.entries(a||{}).forEach(([k,v])=>{
    if(k==="cls")e.className=v;else if(k==="html")e.innerHTML=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="disabled")e.disabled=v;
    else e.setAttribute(k,v);
  });
  (kids||[]).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}

async function loadW(lat,lng,name,isRef){
  if(isRef){S.refreshing=true;render();}
  else{Object.assign(S,{phase:"loading",loading:true});render();}

  let city=name;
  if(!city)city=await apiCity(lat,lng)||`${(+lat).toFixed(3)}, ${(+lng).toFixed(3)}`;

  let data=null,isDemo=false,stationInfo=null,imgwData=null;
  try{
    // Pobierz dane pogodowe i dane ze stacji IMGW równolegle
    const [weatherResult, imgwResult] = await Promise.allSettled([
      apiWeather(lat,lng),
      findNearestIMGW(lat,lng)
    ]);
    if(weatherResult.status==="fulfilled") data=weatherResult.value;
    else throw weatherResult.reason;
    if(imgwResult.status==="fulfilled"&&imgwResult.value){
      imgwData=imgwResult.value.best||imgwResult.value;
      stationInfo=`📡 ${imgwData.stacja||imgwData.name} · ${imgwData.dist} km`;
      // Nadpisz dane z Open-Meteo dokładniejszymi danymi ze stacji IMGW
      if(data&&data.current&&imgwData.temperatura){
        const imgwTemp=parseFloat(imgwData.temperatura);
        const imgwHum=parseFloat(imgwData.wilgotnosc_wzgledna);
        const imgwWind=parseFloat(imgwData.predkosc_wiatru)*3.6; // m/s -> km/h
        const imgwPress=parseFloat(imgwData.cisnienie);
        if(!isNaN(imgwTemp)){
          data.current.temperature_2m=imgwTemp;
          // Przelicz apparent_temperature na podstawie nowej temperatury
          // żeby nie było rozbieżności między temp a odczuwalną
          const windMs=(Math.round(parseFloat(imgwData.predkosc_wiatru||0)*3.6))/3.6;
          if(!isNaN(imgwHum)&&!isNaN(windMs)){
            // Wzór na temperaturę odczuwalną (wind chill / heat index)
            let newFeels=imgwTemp;
            if(imgwTemp<=10&&windMs>1.3){
              // Wind chill
              newFeels=13.12+0.6215*imgwTemp-11.37*Math.pow(windMs*3.6,0.16)+0.3965*imgwTemp*Math.pow(windMs*3.6,0.16);
            } else if(imgwTemp>=27&&!isNaN(imgwHum)){
              // Heat index
              newFeels=-8.784+1.611*imgwTemp+2.338*imgwHum-0.146*imgwTemp*imgwHum;
            }
            data.current.apparent_temperature=Math.round(newFeels*10)/10;
          } else {
            data.current.apparent_temperature=imgwTemp;
          }
        }
        if(!isNaN(imgwHum))data.current.relative_humidity_2m=imgwHum;
        if(!isNaN(imgwWind))data.current.wind_speed_10m=imgwWind;
        if(!isNaN(imgwPress)&&imgwPress>0)data.current.pressure_msl=imgwPress;
        console.log("Dane ze stacji IMGW:",imgwData.stacja,"dist:",imgwData.dist,"km");
      }
    } else {
      stationInfo=`Open-Meteo · ${(+lat).toFixed(3)}°N, ${(+lng).toFixed(3)}°E`;
    }
  }catch(e){
    console.warn("API fail:",e.message);
    isDemo=true;
    // Minimal demo - żadnych absurdów
    stationInfo="Dane demonstracyjne";
    const now=new Date();
    const times=Array.from({length:168},(_,i)=>{const d=new Date(now);d.setHours(now.getHours()+i,0,0,0);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;});
    const dts=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()+i);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;});
    data={
      current:{temperature_2m:18,apparent_temperature:16,relative_humidity_2m:65,weather_code:2,cloud_cover:40,wind_speed_10m:12,wind_gusts_10m:18,wind_direction_10m:220,pressure_msl:1016,uv_index:2.5,precipitation:0,rain:0,snowfall:0,showers:0,is_day:now.getHours()>=6&&now.getHours()<21?1:0},
      hourly:{time:times,temperature_2m:times.map((_,i)=>{const h=new Date(times[i]).getHours();return Math.round(13+6*Math.sin((h-6)*Math.PI/12));}),apparent_temperature:times.map((_,i)=>{const h=new Date(times[i]).getHours();return Math.round(11+5*Math.sin((h-6)*Math.PI/12));}),weather_code:times.map(()=>2),precipitation_probability:times.map(()=>10),precipitation:times.map(()=>0),cloud_cover:times.map(()=>40),uv_index:times.map((_,i)=>{const h=new Date(times[i]).getHours();return Math.max(0,Math.round(3*Math.sin((h-6)*Math.PI/12)*10)/10);}),wind_speed_10m:times.map(()=>12),relative_humidity_2m:times.map(()=>65)},
      daily:{time:dts,weather_code:[2,1,3,2,1,2,3],temperature_2m_max:[22,24,19,21,23,25,20],temperature_2m_min:[12,13,11,12,13,14,11],precipitation_probability_max:[15,10,30,20,10,5,25],precipitation_sum:[0,0,0.5,0,0,0,0.3],uv_index_max:[3,4,2,3,4,5,2],sunrise:dts.map(d=>d+"T04:55"),sunset:dts.map(d=>d+"T20:30"),wind_speed_10m_max:[18,15,22,16,14,12,20]}
    };
  }

  try{localStorage.setItem("aura_v5",JSON.stringify({data,city,lat,lng,ts:Date.now()}));}catch{}
  saveHistory(city,lat,lng);
  Object.assign(S,{phase:"weather",lat,lng,city,data,isDemo,loading:false,refreshing:false,stationInfo,imgwData});
  expDay=null;toastShown=new Set();render();
}

// GPS z pełnym fallbackiem
function handleGPS(){
  gpsErr="";S.loading=true;render();

  const ipFallback=()=>{
    apiIP().then(loc=>{
      S.loading=false;
      if(loc)loadW(loc.lat,loc.lng,loc.city);
      else{gpsErr="Nie udało się ustalić lokalizacji. Wybierz miasto z listy.";render();}
    });
  };

  const lowAccuracy=()=>{
    navigator.geolocation.getCurrentPosition(
      p=>{S.loading=false;loadW(p.coords.latitude,p.coords.longitude,null);},
      ()=>ipFallback(),
      {enableHighAccuracy:false,timeout:8000,maximumAge:0}
    );
  };

  if(!navigator.geolocation){ipFallback();return;}

  navigator.geolocation.getCurrentPosition(
    p=>{S.loading=false;loadW(p.coords.latitude,p.coords.longitude,null);},
    e=>{
      console.warn("GPS err:",e.code);
      if(e.code===1){
        // Odmowa uprawnien
        gpsErr="🔒 Zablokowano GPS. Kliknij kłódkę przy adresie → Lokalizacja → Zezwól. Lub wybierz miasto z listy.";
        S.loading=false;render();
      } else {
        // Timeout/niedostępny - próbuj niską dokładność
        lowAccuracy();
      }
    },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

        {icon:"🌡️",label:"Temperatura",val:`${S.imgwData.temperatura}°C`,ok:!isNaN(parseFloat(S.imgwData.temperatura))},
        {icon:"💧",label:"Wilgotność",val:`${S.imgwData.wilgotnosc_wzgledna}%`,ok:!isNaN(parseFloat(S.imgwData.wilgotnosc_wzgledna))},
        {icon:"💨",label:"Wiatr",val:`${Math.round(parseFloat(S.imgwData.predkosc_wiatru||0)*3.6)} km/h`,ok:true},
        {icon:"🌡️",label:"Ciśnienie",val:`${S.imgwData.cisnienie} hPa`,ok:parseFloat(S.imgwData.cisnienie)>0},
        {icon:"🌧️",label:"Opady",val:`${S.imgwData.suma_opadu||0} mm`,ok:true},
        {icon:"🧭",label:"Kierunek wiatru",val:`${S.imgwData.kierunek_wiatru||"--"}°`,ok:true},
      ].filter(x=>x.ok);
      stItems.forEach(item=>{
        const ic=div({style:{background:"rgba(0,0,0,.2)",border:"1px solid rgba(52,211,153,.1)",borderRadius:"14px",padding:"10px 12px"}});
        ic.appendChild(div({style:{fontSize:"10px",color:"var(--text3)",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"4px"}},[item.icon+" "+item.label]));
        ic.appendChild(div({style:{fontSize:"16px",fontWeight:800,color:"#34D399"}},[item.val]));
        ig.appendChild(ic);
      });
      iw.appendChild(ig);
      sc.appendChild(iw);
    }
    // INDEKS DYSKOMFORTU
    const dc=div({cls:"disc-card",style:{background:disc.color,border:`1px solid ${disc.color.replace('.12',',.35').replace('.1',',.3').replace('.08',',.25')}`}});
    dc.appendChild(div({style:{fontSize:"36px"}},[disc.emoji]));
    const dcR=div({style:{flex:1}});
    dcR.appendChild(div({style:{fontSize:"10px",fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",color:"var(--text3)",marginBottom:"4px"}},["Indeks dyskomfortu termicznego"]));
    dcR.appendChild(div({style:{fontSize:"20px",fontWeight:800,color:"var(--text1)"}},[disc.label]));
    dcR.appendChild(div({style:{fontSize:"12px",color:"var(--text2)",marginTop:"2px"}},["Temp. odczuwalna: "+feels+"°C · wilgotność: "+hum+"%"]));
    dc.appendChild(dcR);sc.appendChild(dc);

    // STAT CARDS
    const statg=div({cls:"stat-grid"});
    [
      {icon:"💨",label:"Wiatr",value:`${wind} km/h`,sub:gusts>wind?`Porywy ${gusts} km/h · ${dir}`:dir},
      {icon:"💧",label:"Wilgotność",value:`${hum}%`,sub:"Względna"},
      {icon:"🌡️",label:"Ciśnienie",value:`${press} hPa`},
      {icon:"🌞",label:"Wschód / Zachód",value:sunrise,sub:`🌇 ${sunset}`},
      {icon:"☁️",label:"Pułap chmur",value:`${cloudCeiling} m`,sub:"Nad terenem"},
      {icon:"👁️",label:"Widoczność",value:`${visibility} km`,sub:visibility>=20?"Bardzo dobra":visibility>=10?"Dobra":"Ograniczona"},
      {icon:"☀️",label:"Temp. na słońcu",value:`${tempSun}°C`,sub:radiation>50?`Promieniowanie ${Math.round(radiation)} W/m²`:"Brak słońca"},
      {icon:"🌳",label:"Temp. w cieniu",value:`${tempShade}°C`,sub:"Temperatura rzeczywista"},
    ].forEach((c,i)=>{
      const card=div({cls:"stat-card",style:{animationDelay:`${i*.07}s`}});
      card.appendChild(sp({cls:"stat-icon"},[c.icon]));
      card.appendChild(div({cls:"stat-label"},[c.label]));
      card.appendChild(div({cls:"stat-value"},[c.value]));
      if(c.sub)card.appendChild(div({cls:"stat-sub"},[c.sub]));
      statg.appendChild(card);
    });sc.appendChild(statg);

    // WYKRES
    sc.appendChild(buildTempChart(hourly,ci));

    // GODZINY
    sc.appendChild(pe({cls:"stitle"},["🕐 Najbliższe godziny"]));
    const hr=div({cls:"hrow"});
    for(let i=0;i<24;i++){
      const idx=ci+i;if(idx>=hourly.time.length)break;
      const hm=wMeta(hourly.weather_code[idx]);
      const hc2=div({cls:"hcard"+(i===0?" now":""),style:{animationDelay:`${i*.04}s`}});
      hc2.appendChild(div({cls:"hcard-time"},[i===0?"Teraz":new Date(hourly.time[idx]).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})]));
      hc2.appendChild(div({cls:"hcard-emoji"},[hm.e]));
      hc2.appendChild(div({cls:"hcard-temp"},[Math.round(hourly.temperature_2m[idx])+"°"]));
      hc2.appendChild(div({cls:"hcard-pop"},["💧"+(hourly.precipitation_probability?.[idx]??0)+"%"]));
      hc2.appendChild(div({cls:"hcard-cloud"},["☁️"+(hourly.cloud_cover?.[idx]??0)+"%"]));
      const prec2=+(hourly.precipitation?.[idx]??0);
      if(prec2>0)hc2.appendChild(div({cls:"hcard-rain"},["🌧️"+prec2.toFixed(1)+"mm"]));
      hr.appendChild(hc2);
    }sc.appendChild(hr);

    // AI
    const ai=div({cls:"ai-card"});
    ai.appendChild(div({cls:"ai-badge"},["✨ Asystent pogodowy"]));
    ai.appendChild(pe({cls:"ai-text"},['"'+adv.a+'"']));
    [{e:"👕",l:"Ubiór",v:adv.cl},{e:"🏃",l:"Aktywność",v:adv.ac}].forEach(s=>{
      const row=div({cls:"ai-row"});
      row.appendChild(sp({cls:"ai-row-icon"},[s.e]));
      const txt=div({});
      txt.appendChild(div({cls:"ai-row-label"},[s.l]));
      txt.appendChild(div({cls:"ai-row-val"},[s.v]));
      row.appendChild(txt);ai.appendChild(row);
    });sc.appendChild(ai);

    // RADAR
    sc.appendChild(buildRadar(current.weather_code,precip));

    // 7 DNI
    sc.appendChild(pe({cls:"stitle"},["📅 Prognoza 7-dniowa"]));
    const dl=div({style:{display:"flex",flexDirection:"column",gap:"8px"}});
    daily.time.slice(0,7).forEach((day,i)=>{
      const dm=wMeta(daily.weather_code[i]);
      const label=i===0?"Dziś":i===1?"Jutro":new Date(day).toLocaleDateString("pl-PL",{weekday:"long"}).replace(/^\w/,c=>c.toUpperCase());
      const open=expDay===i;
      const dw=div({});
      const db=bt({cls:"drow"+(open?" open":""),style:{animationDelay:`${i*.06}s`},onClick:()=>{expDay=open?null:i;render();}});
      db.appendChild(sp({style:{fontSize:"14px",fontWeight:800,color:open?"#A5B4FC":"#E2E8F0",flex:"0 0 80px"}},[label]));
      db.appendChild(sp({style:{fontSize:"26px",lineHeight:1}},[dm.e]));
      db.appendChild(div({style:{display:"flex",flexDirection:"column",alignItems:"center",flex:1,gap:"3px"}},[
        sp({style:{fontSize:"12px",fontWeight:800,color:"#38BDF8"}},["💧"+daily.precipitation_probability_max[i]+"%"]),
        sp({style:{fontSize:"11px",color:"#94A3B8",fontWeight:600}},["☁️"+(daily.precipitation_sum[i]>0?daily.precipitation_sum[i].toFixed(1)+"mm":"sucho")]),
      ]));
      const temps=div({style:{textAlign:"right"}});
      temps.appendChild(div({style:{fontSize:"16px",fontWeight:800,color:"#F1F5F9"}},[Math.round(daily.temperature_2m_max[i])+"°"]));
      temps.appendChild(div({style:{fontSize:"12px",color:"#94A3B8",fontWeight:600}},[Math.round(daily.temperature_2m_min[i])+"°"]));
      db.appendChild(temps);
      db.appendChild(sp({style:{fontSize:"10px",color:open?"var(--blue2)":"var(--text3)",display:"inline-block",transition:"transform .3s",transform:open?"rotate(180deg)":"none"}},["▼"]));
      dw.appendChild(db);
      if(open){
        const det=div({style:{animation:"fadeUp .3s ease",paddingTop:"8px"}});
        const dc2=div({style:{display:"flex",gap:"8px",overflowX:"auto",paddingBottom:"8px"}});
        [{l:"Max",v:Math.round(daily.temperature_2m_max[i])+"°"},{l:"Min",v:Math.round(daily.temperature_2m_min[i])+"°"},{l:"Opady",v:(daily.precipitation_sum[i]||0).toFixed(1)+" mm"},{l:"UV max",v:(daily.uv_index_max?.[i]||0).toFixed(1)},
          ...(daily.sunrise?.[i]?[{l:"Wschód",v:new Date(daily.sunrise[i]).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})}]:[]),
          ...(daily.sunset?.[i]?[{l:"Zachód",v:new Date(daily.sunset[i]).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})}]:[]),
        ].forEach((s,j)=>{
          const mc=div({cls:"mcard",style:{animation:`scaleIn .3s ease ${j*.05}s both`}});
          mc.appendChild(div({style:{fontSize:"10px",color:"#64748B",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"5px"}},[s.l]));
          mc.appendChild(div({style:{fontSize:"15px",fontWeight:800,color:"#F1F5F9"}},[s.v]));
          dc2.appendChild(mc);
        });
        det.appendChild(dc2);
        // Godziny dnia
        const dateStr=day.slice(0,10);
        const dayH=[];
        hourly.time.forEach((t,idx)=>{
          if(t.startsWith(dateStr))dayH.push({lb:new Date(t).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"}),e:wMeta(hourly.weather_code[idx]).e,t:Math.round(hourly.temperature_2m[idx]),pop:hourly.precipitation_probability?.[idx]??0,cloud:hourly.cloud_cover?.[idx]??0,precip:(+(hourly.precipitation?.[idx]??0)).toFixed(1)});
        });
        if(dayH.length>0){
          det.appendChild(pe({style:{fontSize:"10px",fontWeight:800,textTransform:"uppercase",letterSpacing:"2px",color:"#94A3B8",margin:"8px 0 10px 2px"}},["🕐 Godziny"]));
          const hRow=div({cls:"hrow"});
          dayH.forEach((hh,j)=>{
            const hc3=div({cls:"hcard",style:{animation:`scaleIn .25s ease ${j*.03}s both`}});
            hc3.appendChild(div({cls:"hcard-time"},[hh.lb]));
            hc3.appendChild(div({cls:"hcard-emoji"},[hh.e]));
            hc3.appendChild(div({cls:"hcard-temp"},[hh.t+"°"]));
            hc3.appendChild(div({cls:"hcard-pop"},["💧"+hh.pop+"%"]));
            hc3.appendChild(div({cls:"hcard-cloud"},["☁️"+hh.cloud+"%"]));
            if(parseFloat(hh.precip)>0)hc3.appendChild(div({cls:"hcard-rain"},["🌧️"+hh.precip+"mm"]));
            hRow.appendChild(hc3);
          });
          det.appendChild(hRow);
        }
        dw.appendChild(det);
      }
      dl.appendChild(dw);
    });
    sc.appendChild(dl);
    w.appendChild(sc);return w;

  }catch(err){
    console.error("screenWeather crash:",err);
    try{localStorage.removeItem("aura_v5");}catch{}
    Object.assign(S,{phase:"intro",data:null});
    setTimeout(render,100);
    return div({});
  }
}

function render(){
  if(RAF&&S.phase!=="weather"){cancelAnimationFrame(RAF);RAF=null;}
  const app=document.getElementById("app");app.innerHTML="";
  if(S.phase==="intro")app.appendChild(screenIntro());
  else if(S.phase==="loading")app.appendChild(screenSkeleton());
  else if(S.phase==="weather"&&S.data)app.appendChild(screenWeather());
}

(function init(){
  // Wyczyść stary cache z poprzednich wersji
  try{
    ["aura","aura_v2","aura_v3","aura_v4"].forEach(k=>{
      try{localStorage.removeItem(k);}catch{}
    });
    const c=localStorage.getItem("aura_v5");
    if(c){
      const d=JSON.parse(c);
      if(d&&d.data&&d.city&&d.data.current&&d.data.hourly&&d.data.daily&&(Date.now()-d.ts)<7200000){
        Object.assign(S,{phase:"weather",lat:d.lat,lng:d.lng,city:d.city,data:d.data,isDemo:false,stationInfo:`Open-Meteo (IMGW/SYNOP) · ${(+d.lat).toFixed(3)}°N, ${(+d.lng).toFixed(3)}°E`});
      }
    }
  }catch(e){console.warn("Cache err:",e);}
  render();
  if("serviceWorker"in navigator){
    try{
      const sw=`self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>clients.claim());self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open("aura-v5").then(ca=>ca.put(e.request,c));return r;}).catch(()=>caches.match(e.request)));});`;
      const blob=new Blob([sw],{type:"application/javascript"});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }catch{}
  }
})();
</script>
</body>
</html>
